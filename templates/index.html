<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/index.css">
    <title>GUDLFT Registration</title>
</head>
<body>
    <div class="container">
        <h1>Welcome to the GUDLFT Registration Portal!</h1>
        <p class="subtitle">Please enter your secretary email and password to continue:</p>
        
        <!-- AJOUTEZ CETTE SECTION POUR LES MESSAGES FLASH -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        <form action="showSummary" method="post">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="secretary@example.com" required/>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required/>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    <script src="../static/js/main.js"></script>
</body>
</html>
