<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/points.css">
    <title>Club Points | GUDLFT</title>
</head>
<body>
    <div class="container">
        <h1>Club Points Overview</h1>
        <a href="javascript:history.back()" class="back-button">← Back to Competitions</a>
        
        <table>
            <thead>
                <tr>
                    <th>Club Name</th>
                    <th>Email</th>
                    <th>Points Available</th>
                </tr>
            </thead>
            <tbody>
                {% for club in clubs %}
                <tr>
                    <td>{{ club['name'] }}</td>
                    <td>{{ club['email'] }}</td>
                    <td>{{ club['points'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <link rel="stylesheet" href="../static/js/main.js">
</body>
</html>
