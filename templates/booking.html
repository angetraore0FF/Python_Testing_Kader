<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
        }

        h2 {
            color: #1e3c72;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: center;
        }

        .places-info {
            background: linear-gradient(135deg, #e8f4fd 0%, #d4e9f7 100%);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            color: #1e3c72;
            font-weight: 500;
            border-left: 5px solid #2a5298;
        }

        .places-info strong {
            font-size: 24px;
            color: #2a5298;
        }

        .flash-messages {
            list-style: none;
            margin-bottom: 25px;
        }

        .flash-messages li {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px 20px;
            border: 2px solid #f5c6cb;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        input[type="number"]:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(42, 82, 152, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .info-note {
            background: #fff3cd;
            color: #856404;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #ffeaa7;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
            }

            h2 {
                font-size: 26px;
            }

            .places-info {
                font-size: 16px;
            }

            .places-info strong {
                font-size: 20px;
            }

            input[type="number"],
            button[type="submit"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{competition['name']}}</h2>
        
        <div class="places-info">
            Places available: <strong>{{competition['numberOfPlaces']}}</strong>
        </div>
        
        <!-- Ajout de l'affichage des messages flash -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        
        <form action="/purchasePlaces" method="post">
            <input type="hidden" name="club" value="{{club['name']}}">
            <input type="hidden" name="competition" value="{{competition['name']}}">
            
            <div class="form-group">
                <label for="places">How many places?</label>
                <input type="number" name="places" id="places" min="1" max="12" placeholder="Enter number (max: 12)" required/>
            </div>
            
            <div class="info-note">
                ℹ️ Maximum 12 places per booking
            </div>
            
            <button type="submit">Book Places</button>
        </form>
    </div>
</body>
</html>
